name: AEM Maven Build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Step 2: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build AEM project
        run: mvn clean install -PadobePublic

      - name: Upload AEM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: aem-all-package
          path: all/target/*.zip
